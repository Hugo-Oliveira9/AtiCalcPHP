name: PHP calculadora

on:
  push:
    branches: [main]

jobs:
  calculadora:
    runs-on: ubuntu-latest

    steps:
      - name: Download repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Executar calculadora
        run: php calculadora.php
